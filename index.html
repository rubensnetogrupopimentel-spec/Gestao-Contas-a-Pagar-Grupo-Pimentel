        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\/\.\,\-\_\(\)]/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
        }

        const mapaEmpresasNormalizadas = {};
        empresasFixas.forEach(emp => { mapaEmpresasNormalizadas[normalizarTexto(emp)] = emp; });

        function formatDate(val) {
            if (!val) return '';
            if (val instanceof Date) return `${String(val.getDate()).padStart(2, '0')}/${String(val.getMonth() + 1).padStart(2, '0')}/${val.getFullYear()}`;
            if (typeof val === 'number') {
                const date = new Date((val - (25567 + 2)) * 86400 * 1000);
                return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
            }
            return String(val);
        }

        function parseNumericValue(val) {
            if (val === null || val === undefined || val === '' || val === '---') return null;
            if (typeof val === 'number') return val;
            let strVal = String(val).trim().replace(/[R$\s\-\+]/g, '');
            if (strVal.includes(',')) strVal = strVal.replace(/\./g, '').replace(',', '.');
            let num = parseFloat(strVal);
            return isNaN(num) ? null : num;
        }

        document.getElementById('excelFile').addEventListener('change', handleFile, false);
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: true });
                parsedData = {};

                workbook.SheetNames.forEach(sheetName => {
                    const norm = normalizarTexto(sheetName);
                    let matchedEmpresa = mapaEmpresasNormalizadas[norm];
                    if (!matchedEmpresa) {
                        for (let key in mapaEmpresasNormalizadas) {
                            if (norm.includes(key) || key.includes(norm)) { matchedEmpresa = mapaEmpresasNormalizadas[key]; break; }
                        }
                    }
                    if (!matchedEmpresa) return;

                    const sheet = workbook.Sheets[sheetName];
                    const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
                    if (!rawRows || rawRows.length === 0) return;

                    let headerIdx = -1;
                    for (let i = 0; i < rawRows.length; i++) {
                        const rowStr = rawRows[i].join(' ').toLowerCase();
                        if (rowStr.includes('vencimento') || rowStr.includes('fornecedor') || rowStr.includes('valor')) { headerIdx = i; break; }
                    }

                    if (headerIdx !== -1) {
                        let rawHeaders = rawRows[headerIdx].map(h => String(h || '').trim());
                        let originalHeaders = rawHeaders.filter(h => !h.toLowerCase().includes('observa') && !h.toLowerCase().includes('status'));
                        let headers = [...originalHeaders, 'Status', 'Observação'];
                        let valorColIdx = originalHeaders.findIndex(h => h.toLowerCase().includes('valor'));
                        let vencColIdx = originalHeaders.findIndex(h => h.toLowerCase().includes('vencimento') || h.toLowerCase().includes('venc'));
                        
                        let fornecedorColIdx = originalHeaders.findIndex(h => {
                            let normH = normalizarTexto(h);
                            return normH.includes('FORNECEDOR') || normH.includes('BENEFICIARIO') || normH.includes('NOME') || normH.includes('RAZAO');
                        });
                        let historicoColIdx = originalHeaders.findIndex(h => {
                            let normH = normalizarTexto(h);
                            return normH.includes('HISTORICO') || normH.includes('DESCRICAO');
                        });

                        const rows = [];
                        for (let i = headerIdx + 1; i < rawRows.length; i++) {
                            const row = rawRows[i];
                            if (!row || row.length === 0) continue;
                            let rawVal = valorColIdx !== -1 ? row[valorColIdx] : null;
                            let numVal = parseNumericValue(rawVal);
                            let lineText = row.join(' ').toUpperCase();
                            if (lineText.includes('TOTAL DA EMPRESA') || lineText.includes('SUBTOTAL')) continue;

                            if (numVal !== null && numVal > 0) {
                                let newRowData = originalHeaders.map((_, colI) => row[colI] !== undefined ? row[colI] : '');
                                newRowData.push('Programado');
                                newRowData.push('');
                                rows.push({
                                    id: i, headers, data: newRowData, valor: numVal,
                                    vencimentoIdx: vencColIdx, valorIdx: valorColIdx,
                                    fornecedorIdx: fornecedorColIdx, historicoIdx: historicoColIdx,
                                    fornecedorVal: fornecedorColIdx !== -1 ? String(row[fornecedorColIdx] || '').trim() : '',
                                    historicoVal: historicoColIdx !== -1 ? String(row[historicoColIdx] || '').trim() : '',
                                    statusIdx: headers.length - 2, obsIdx: headers.length - 1,
                                    status: 'Programado', observacao: ''
                                });
                            }
                        }
                        if (rows.length > 0) parsedData[matchedEmpresa] = { headers, rows };
                    }
                });

                salvarNaNuvem();
                alert('Planilha importada e sincronizada com sucesso!');
            };
            reader.readAsArrayBuffer(file);
        }

                            </tr>

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
            const dataHoje = new Date().toISOString().slice(0, 10);

            let temDados = false;
            let firstPage = true;

            for (const empresa of empresasFixas) {
                const sheetObj = parsedData[empresa];
                if (!sheetObj || !sheetObj.rows) continue;

                const listaFiltrada = sheetObj.rows.filter(r => filtroRelatorioStatus === 'TODOS' || (r.status || 'Programado') === filtroRelatorioStatus);
                if (listaFiltrada.length === 0) continue;

                temDados = true;
                if (!firstPage) doc.addPage();
                firstPage = false;

                const empTotalVal = listaFiltrada.reduce((sum, r) => sum + r.valor, 0);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.setTextColor(15, 23, 42);
                doc.text("GRUPO PIMENTEL", 14, 15);

                doc.setFontSize(9);
                doc.setTextColor(100, 116, 139);
                doc.text(`RELATÓRIO FINANCEIRO - FILTRO: ${filtroRelatorioStatus.toUpperCase()}`, 14, 21);

                doc.setFillColor(209, 250, 229);
                doc.setDrawColor(167, 243, 208);
                doc.roundedRect(245, 10, 38, 7, 3, 3, 'FD');
                doc.setFont("helvetica", "bold");
                doc.setFontSize(8);
                doc.setTextColor(6, 95, 70);
                doc.text("Aprovação Direção", 264, 14.5, { align: 'center' });

                doc.setDrawColor(16, 185, 129);
                doc.setLineWidth(0.5);
                doc.line(14, 25, 283, 25);

                doc.setFillColor(236, 253, 245);
                doc.setDrawColor(167, 243, 208);
                doc.roundedRect(14, 29, 269, 12, 2, 2, 'FD');
                
                doc.setFont("helvetica", "bold");
                doc.setFontSize(9);
                doc.setTextColor(6, 95, 70);
                doc.text("EMPRESA:", 18, 36);
                doc.setFont("helvetica", "normal");
                doc.setTextColor(15, 23, 42);
                doc.text(empresa, 38, 36);

                doc.setFont("helvetica", "bold");
                doc.setTextColor(6, 95, 70);
                doc.text(`TOTAL (${listaFiltrada.length} TÍTULOS):`, 200, 36);
                doc.setFont("helvetica", "bold");
                doc.setTextColor(6, 95, 70);
                doc.text(empTotalVal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }), 278, 36, { align: 'right' });

                let startY = 46;
                let headers = ["VENCIMENTO", "FORNECEDOR", "HISTÓRICO", "STATUS", "OBS", "VALOR (R$)"];
                let colWidths = [28, 65, 100, 26, 25, 25];
                let startX = 14;

                doc.setFillColor(15, 23, 42);
                doc.rect(startX, startY, 269, 7, 'F');
                doc.setFont("helvetica", "bold");
                doc.setFontSize(8);
                doc.setTextColor(255, 255, 255);

                let currentX = startX;
                headers.forEach((h, idx) => {
                    let align = (idx === 5) ? 'right' : ((idx === 3) ? 'center' : 'left');
                    let textX = currentX + 2;
                    if (align === 'right') textX = currentX + colWidths[idx] - 2;
                    if (align === 'center') textX = currentX + (colWidths[idx] / 2);
                    doc.text(h, textX, startY + 4.5, { align: align });
                    currentX += colWidths[idx];
                });

                startY += 7;
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);

                listaFiltrada.forEach((r, rowIndex) => {
                    let venc = r.vencimentoIdx !== -1 && r.data[r.vencimentoIdx] ? formatDate(r.data[r.vencimentoIdx]) : '-';
                    let forn = r.fornecedorVal || '-';
                    let hist = r.historicoVal || '-';
                    let obs = r.observacao || '-';
                    let statusVal = r.status || 'Programado';

                    let histLines = doc.splitTextToSize(hist, colWidths[2] - 4);
                    let fornLines = doc.splitTextToSize(forn, colWidths[1] - 4);
                    let obsLines = doc.splitTextToSize(obs, colWidths[4] - 4);
                    
                    let maxLines = Math.max(histLines.length, fornLines.length, obsLines.length, 1);
                    let rowHeight = Math.max(7, maxLines * 4 + 3);

                    if (startY + rowHeight > 190) {
                        doc.setDrawColor(203, 213, 225);
                        doc.setLineWidth(0.2);
                        doc.line(14, 198, 283, 198);
                        doc.setFont("helvetica", "normal");
                        doc.setFontSize(8);
                        doc.setTextColor(100, 116, 139);
                        doc.text("Grupo Pimentel - Relatório de Gestão Financeira", 14, 203);
                        doc.addPage();
                        startY = 15;
                    }

                    if (rowIndex % 2 === 0) {
                        doc.setFillColor(248, 250, 252);
                        doc.rect(startX, startY, 269, rowHeight, 'F');
                    }

                    doc.setDrawColor(226, 232, 240);
                    doc.setLineWidth(0.1);
                    doc.rect(startX, startY, 269, rowHeight);

                    doc.setTextColor(51, 65, 85);
                    doc.text(venc, startX + 2, startY + 4.5);
                    doc.text(fornLines, startX + colWidths[0] + 2, startY + 4.5);
                    doc.text(histLines, startX + colWidths[0] + colWidths[1] + 2, startY + 4.5);

                    let badgeX = startX + colWidths[0] + colWidths[1] + colWidths[2] + 2;
                    let badgeY = startY + (rowHeight / 2) - 3;
                    doc.setFillColor(224, 242, 254);
                    doc.setDrawColor(186, 230, 253);
                    if (statusVal === 'Aprovado') { doc.setFillColor(209, 250, 229); doc.setDrawColor(167, 243, 208); }
                    if (statusVal === 'Aguardar') { doc.setFillColor(254, 243, 199); doc.setDrawColor(252, 211, 77); }
                    if (statusVal === 'Negar') { doc.setFillColor(255, 228, 230); doc.setDrawColor(254, 205, 211); }
                    
                    doc.roundedRect(badgeX, badgeY, 22, 6, 1.5, 1.5, 'FD');
                    
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(7);
                    doc.setTextColor(3, 105, 161);
                    if (statusVal === 'Aprovado') doc.setTextColor(6, 95, 70);
                    if (statusVal === 'Aguardar') doc.setTextColor(146, 64, 14);
                    if (statusVal === 'Negar') doc.setTextColor(159, 18, 57);
                    
                    doc.text(statusVal, badgeX + 11, badgeY + 4, { align: 'center' });
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(8);
                    doc.setTextColor(51, 65, 85);

                    doc.text(obsLines, badgeX + colWidths[3] + 2, startY + 4.5);
                    
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(4, 120, 87);
                    let valStr = r.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    doc.text(valStr, startX + 269 - 2, startY + 4.5, { align: 'right' });
                    doc.setFont("helvetica", "normal");

                    startY += rowHeight;
                });

                doc.setDrawColor(203, 213, 225);
                doc.setLineWidth(0.2);
                doc.line(14, 198, 283, 198);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.setTextColor(100, 116, 139);
                doc.text("Grupo Pimentel - Relatório de Gestão Financeira", 14, 203);
            }

            if (temDados) {
                doc.save(`Relatorio_${filtroRelatorioStatus}_Pimentel_${dataHoje}.pdf`);
            } else {
                alert('Nenhum título encontrado para o filtro selecionado.');
            }
        };

        window.updateRowStatus = function(sheetName, rowIndex, newStatus) {
            if (parsedData[sheetName] && parsedData[sheetName].rows) {
                const rowObj = parsedData[sheetName].rows.find(r => r.id === rowIndex);
                if (rowObj) { rowObj.status = newStatus; rowObj.data[rowObj.statusIdx] = newStatus; }
            }
            salvarNaNuvem();
        };

        window.updateRowObs = function(sheetName, rowIndex, newObs) {
            if (parsedData[sheetName] && parsedData[sheetName].rows) {
                const rowObj = parsedData[sheetName].rows.find(r => r.id === rowIndex);
                if (rowObj) { rowObj.observacao = newObs; rowObj.data[rowObj.obsIdx] = newObs; }
            }
            salvarNaNuvem();
        };

        function renderSicoobCards() {
            const grid = document.getElementById('sicoobCardsGrid');
            grid.innerHTML = '';
            let totalSaldo = 0;
            empresasFixas.forEach(emp => {
                let val = sicoobSaldos[emp] || 0;
                totalSaldo += val;
                grid.innerHTML += `
                    <div class="p-3 rounded-xl border border-slate-200 bg-[#f8fafc] flex flex-col justify-between gap-2">
                        <span class="text-[11px] font-bold text-[#1e293b] uppercase truncate">${emp}</span>
                        <input type="text" value="${val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}" 
                            onfocus="this.value='${val}'; this.select();" 
                            onblur="updateSaldo('${emp}', this.value)" 
                            class="w-full text-xs font-bold bg-white border border-slate-300 rounded-md px-2 py-1 outline-none">
                    </div>`;
            });
            document.getElementById('totalSaldoSicoob').innerText = totalSaldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        window.updateSaldo = function(empresa, valStr) {
            sicoobSaldos[empresa] = parseNumericValue(valStr) || 0;
            salvarNaNuvem();
        };

        function renderTabs() {
            const tabsHeader = document.getElementById('tabsHeader');
            tabsHeader.innerHTML = `<button class="tab-btn px-4 py-2 text-sm font-medium rounded-lg ${activeTab === 'consolidated' ? 'active' : ''}" onclick="switchTab('consolidated', this)">📊 Dashboard Geral</button>`;
            empresasFixas.forEach(sheetName => {
                tabsHeader.innerHTML += `<button class="tab-btn px-4 py-2 text-sm font-medium rounded-lg ${activeTab === sheetName ? 'active' : ''}" onclick="switchTab('${sheetName}', this)">${sheetName}</button>`;
            });
        }

        window.switchTab = function(sheetName, element) {
            activeTab = sheetName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');
            if (sheetName === 'consolidated') {
                document.getElementById('consolidatedView').classList.remove('hidden');
                document.getElementById('sheetDetailView').classList.add('hidden');
            } else {
                document.getElementById('consolidatedView').classList.add('hidden');
                document.getElementById('sheetDetailView').classList.remove('hidden');
                renderSheetDetail(sheetName);
            }
        };

        function renderConsolidated() {
            let totalGeral = 0, totalTitulos = 0;
            const summaryData = [];
            empresasFixas.forEach(empresa => {
                const item = parsedData[empresa];
                let sheetTotal = 0, sheetCount = 0;
                if (item && item.rows) {
                    let aprovados = item.rows.filter(r => (r.status || 'Programado') === 'Aprovado');
                    sheetTotal = aprovados.reduce((s, r) => s + r.valor, 0);
                    sheetCount = aprovados.length;
                }
                summaryData.push({ empresa, total: sheetTotal, titulos: sheetCount, saldo: (sicoobSaldos[empresa] || 0) - sheetTotal });
                totalGeral += sheetTotal; totalTitulos += sheetCount;
            });
            document.getElementById('kpiTotal').innerText = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('kpiTitulos').innerText = totalTitulos;

            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            summaryData.forEach(item => {
                const info = contasBancariasInfo[item.empresa] || { conta: '-', cnpj: '-' };
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="py-3 px-2">Conta ${info.conta} (${info.cnpj})</td>
                        <td class="py-3 px-2 font-bold uppercase text-xs">${item.empresa}</td>
                        <td class="py-3 px-2 font-bold ${item.saldo < 0 ? 'text-rose-600' : 'text-emerald-600'}">${item.saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                        <td class="py-3 px-2 text-right font-bold">${item.total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                    </tr>`;
            });
        }

        function renderSheetDetail(sheetName) {
            const sheetObj = parsedData[sheetName];
            const thead = document.getElementById('detailTableHeader');
            const tbody = document.getElementById('detailTableBody');
            thead.innerHTML = ''; tbody.innerHTML = '';
            if (!sheetObj || !sheetObj.rows) return;

            document.getElementById('currentSheetName').innerText = `Empresa: ${sheetName}`;
            document.getElementById('sheetRecordCount').innerText = `${sheetObj.rows.length} títulos`;
            
            let hTr = '<tr>';
            sheetObj.headers.forEach(h => hTr += `<th class="py-2 px-3">${h}</th>`);
            thead.innerHTML = hTr + '</tr>';

            sheetObj.rows.forEach(r => {
                let tr = '<tr>';
                sheetObj.headers.forEach((h, idx) => {
                    if (idx === r.statusIdx) {
                        tr += `<td><select onchange="updateRowStatus('${sheetName}', ${r.id}, this.value)" class="text-xs font-bold rounded px-2 py-1 bg-sky-50 border"><option value="Programado" ${r.status==='Programado'?'selected':''}>Programado</option><option value="Aprovado" ${r.status==='Aprovado'?'selected':''}>Aprovado</option><option value="Aguardar" ${r.status==='Aguardار'?'selected':''}>Aguardar</option><option value="Negar" ${r.status==='Negar'?'selected':''}>Negar</option></select></td>`;
                    } else if (idx === r.obsIdx) {
                        tr += `<td><input type="text" value="${r.observacao || ''}" onblur="updateRowObs('${sheetName}', ${r.id}, this.value)" class="text-xs border rounded px-2 py-1 w-full"></td>`;
                    } else {
                        let val = r.data[idx];
                        if (idx === r.vencimentoIdx) val = formatDate(val);
                        if (idx === r.valorIdx) val = r.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        tr += `<td class="py-2 px-3">${val || ''}</td>`;
                    }
                });
                tbody.innerHTML += tr + '</tr>';
            });
        }
    </script>
